<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYANAT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 로그인 화면 -->
    <div id="login-screen" class="screen active">
        <div class="login-wrap">
            <div class="login-logo">
                <h1>AYANAT</h1>
            </div>
            <div class="login-form">
                <input type="text" id="login-username" placeholder="아이디" autocomplete="username">
                <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password">
                <button class="btn-primary" onclick="doLogin()">로그인</button>
                <p id="login-error" class="msg-error"></p>
            </div>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div id="main-screen" class="screen">
        <!-- 상단 바 -->
        <div class="topbar">
            <div class="topbar-left">
                <span class="topbar-title">AYANAT</span>
            </div>
            <div class="topbar-right">
                <span id="user-info" class="topbar-user"></span>
                <button class="btn-icon btn-logout" onclick="doLogout()" title="로그아웃">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
        <div id="server-busy-banner" class="busy-banner" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>서버가 혼잡합니다</span>
        </div>

        <!-- 하단 탭 네비게이션 -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('tunnel')" data-tab="tunnel">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span>터널</span>
            </button>
            <button id="admin-tab-btn" class="nav-item" style="display:none;" onclick="switchTab('admin')" data-tab="admin">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>관리</span>
            </button>
        </nav>

        <!-- 터널 탭 -->
        <div id="tab-tunnel" class="tab-content active">

            <!-- 크레딧 카드 -->
            <div class="card card-credits">
                <div class="credits-top">
                    <span class="credits-label">잔여 크레딧</span>
                    <span id="credits-plan" class="badge-plan"></span>
                </div>
                <div class="credits-main">
                    <span id="credits-display" class="credits-value">0분</span>
                </div>
                <div id="credits-time" class="credits-sub"></div>
            </div>

            <!-- 요금제 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">요금제</span>
                </div>
                <div id="plan-request-area"></div>
                <button class="btn-secondary" onclick="showPlanRequestDialog()">요금제 신청</button>
            </div>

            <!-- 터널 설정 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">터널 설정</span>
                </div>
                <div class="field">
                    <label>대상 주소</label>
                    <input type="text" id="target-host" value="127.0.0.1" placeholder="127.0.0.1">
                </div>
                <div class="field">
                    <label>포트</label>
                    <input type="number" id="target-port" value="25565" placeholder="25565">
                </div>
                <div class="field">
                    <label>프로토콜</label>
                    <div class="proto-select">
                        <button class="proto-opt active" onclick="selectProto('tcp', this)">TCP</button>
                        <button class="proto-opt" onclick="selectProto('udp', this)">UDP</button>
                    </div>
                </div>
                <button id="tunnel-btn" onclick="toggleTunnel()" class="btn-primary btn-tunnel">터널 열기</button>
            </div>

            <!-- 터널 상태 -->
            <div id="tunnel-status" class="card" style="display:none;">
                <div class="card-header">
                    <span class="card-title">터널 상태</span>
                    <span id="status-indicator" class="status-dot off"></span>
                </div>
                <div class="field-row">
                    <span class="field-label">외부 주소</span>
                    <span id="public-address" class="field-value mono">-</span>
                    <button class="btn-copy" onclick="copyAddress()">복사</button>
                </div>
                <div class="divider"></div>
                <div class="card-subtitle">접속자 목록</div>
                <div id="conn-list"></div>
            </div>

            <!-- 비밀번호 변경 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">비밀번호 변경</span>
                </div>
                <div class="field">
                    <label>현재 비밀번호</label>
                    <input type="password" id="pw-old" placeholder="현재 비밀번호">
                </div>
                <div class="field">
                    <label>새 비밀번호</label>
                    <input type="password" id="pw-new" placeholder="4자 이상">
                </div>
                <div class="field">
                    <label>비밀번호 확인</label>
                    <input type="password" id="pw-new2" placeholder="새 비밀번호 확인">
                </div>
                <button class="btn-secondary" onclick="doChangePassword()">비밀번호 변경</button>
                <p id="pw-result" class="msg-success"></p>
            </div>
        </div>

        <!-- 관리자 탭 -->
        <div id="tab-admin" class="tab-content">

            <!-- 사용자 생성 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">사용자 생성</span>
                </div>
                <div class="field">
                    <label>아이디</label>
                    <input type="text" id="new-username" placeholder="아이디">
                </div>
                <div class="field">
                    <label>비밀번호</label>
                    <input type="password" id="new-password" placeholder="비밀번호">
                </div>
                <div class="field">
                    <label>크레딧</label>
                    <input type="number" id="new-credits" value="0" min="0" placeholder="0">
                </div>
                <button class="btn-primary" onclick="doCreateUser()">생성</button>
                <p id="create-result" class="msg-success"></p>
            </div>

            <!-- 요금제 신청 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">요금제 신청</span>
                    <button class="btn-small" onclick="refreshPlanRequests()">새로고침</button>
                </div>
                <div id="plan-request-list"></div>
            </div>

            <!-- 사용자 목록 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">사용자 목록</span>
                    <button class="btn-small" onclick="refreshUsers()">새로고침</button>
                </div>
                <div id="user-list"></div>
            </div>

            <!-- 크레딧 관리 -->
            <div id="credit-panel" class="card" style="display:none;">
                <div class="card-header">
                    <span class="card-title">크레딧 관리</span>
                    <span id="credit-target" class="badge-plan"></span>
                </div>
                <div class="field">
                    <label>크레딧 (분)</label>
                    <input type="number" id="credit-amount" value="100" min="0">
                </div>
                <div class="btn-grid">
                    <button class="btn-primary" onclick="doAddCredits()">추가</button>
                    <button class="btn-danger" onclick="doRemoveCredits()">제거</button>
                </div>
                <div class="divider"></div>
                <div class="field">
                    <label>크레딧 직접 설정</label>
                    <input type="number" id="set-credit-amount" value="100" min="0">
                </div>
                <button class="btn-secondary" onclick="doSetCredits()">설정</button>
                <p id="credit-result" class="msg-success"></p>
            </div>

            <!-- 제재 관리 -->
            <div id="ban-panel" class="card" style="display:none;">
                <div class="card-header">
                    <span class="card-title">제재 관리</span>
                    <span id="ban-target" class="badge-plan"></span>
                </div>
                <div class="field">
                    <label>제재 사유</label>
                    <input type="text" id="ban-reason" placeholder="사유 입력">
                </div>
                <div class="btn-grid">
                    <button class="btn-danger" onclick="doBanUser()">제재</button>
                    <button class="btn-secondary" onclick="doUnbanUser()">해제</button>
                </div>
                <div class="divider"></div>
                <div class="btn-grid">
                    <button class="btn-secondary" onclick="doForceDisconnect()">강제 해제</button>
                    <button class="btn-secondary" onclick="doForceCloseTunnels()">터널 종료</button>
                    <button class="btn-danger" onclick="doDeleteUser()">계정 삭제</button>
                </div>
                <div class="divider"></div>
                <div class="field">
                    <label>비밀번호 초기화</label>
                    <input type="password" id="reset-pw" placeholder="새 비밀번호">
                    <button class="btn-secondary" style="margin-top:8px;" onclick="doResetPassword()">초기화</button>
                </div>
                <p id="ban-result" class="msg-success"></p>
            </div>

            <!-- 사용자 로그 -->
            <div id="log-panel" class="card" style="display:none;">
                <div class="card-header">
                    <span class="card-title">사용자 로그</span>
                    <span id="log-target" class="badge-plan"></span>
                </div>
                <div id="log-content" class="log-box"></div>
                <div class="btn-grid" style="margin-top:8px;">
                    <button class="btn-secondary" onclick="refreshUserLog()">새로고침</button>
                    <button class="btn-danger" onclick="doDeleteUserLog()">로그 삭제</button>
                </div>
                <p id="log-result" class="msg-success"></p>
            </div>

            <!-- 공지 관리 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">공지 관리</span>
                </div>
                <textarea id="notice-input" rows="3" placeholder="공지 내용 (비우면 해제)"></textarea>
                <div class="btn-grid" style="margin-top:8px;">
                    <button class="btn-primary" onclick="doSetNotice()">등록</button>
                    <button class="btn-secondary" onclick="doClearNotice()">해제</button>
                </div>
                <p id="notice-result" class="msg-success"></p>
            </div>
        </div>
    </div>

    <!-- 공지 모달 -->
    <div id="notice-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <h3>공지</h3>
            <p id="notice-text"></p>
            <button class="btn-primary" onclick="closeNoticeModal()">확인</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
